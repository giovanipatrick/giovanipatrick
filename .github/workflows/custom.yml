name: Snake Game

# Controlador do tempo que será feito a atualização dos arquivos.
on:
  schedule:
    # Será atualizado a cada 5 horas.
    - cron: "0 */5 * * *"
  workflow_dispatch:

# Regras
jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      # Verifica o repositório
      - uses: actions/checkout@v3  # Atualizando para a versão mais recente da action

      # Repositório que será utilizado para gerar os arquivos
      - uses: Platane/snk@master
        id: snake-gif
        with:
          github_user_name: nomeUsuario  # Seu usuário no GitHub
          gif_out_path: dist/github-contribution-grid-snake.gif
          svg_out_path: dist/github-contribution-grid-snake.svg

      # Verifica se há alterações no repositório
      - run: git status

      # Para as atualizações
      - name: Push changes
        uses: ad-m/github-push-action@v0.6.0  # Atualizado para a versão mais recente da ação
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: master
          force: true

      # Publicação do site no GitHub Pages
      - uses: crazy-max/ghaction-github-pages@v3  # Atualizado para versão mais recente
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
